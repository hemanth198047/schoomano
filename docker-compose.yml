# Local development dependencies only. Services are added when a slice first needs them
# (object storage + malware scanning arrive with M03 documents; a mail catcher with M13 notifications).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: schoomano
      POSTGRES_USER: ${SCHOOMANO_DB_OWNER_USER:-schoomano_owner}
      POSTGRES_PASSWORD: ${SCHOOMANO_DB_OWNER_PASSWORD:?set SCHOOMANO_DB_OWNER_PASSWORD in .env}
      SCHOOMANO_DB_APP_PASSWORD: ${SCHOOMANO_DB_APP_PASSWORD:?set SCHOOMANO_DB_APP_PASSWORD in .env}
      TZ: Asia/Kolkata
    ports:
      - "127.0.0.1:${SCHOOMANO_DB_PORT:-5432}:5432"
    volumes:
      - schoomano-pg:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./db:/schoomano-db:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d schoomano"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  schoomano-pg:
