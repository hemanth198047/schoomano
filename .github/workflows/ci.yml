name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Unit tests (core policy/config) + Testcontainers API tests (Docker is available on ubuntu runners).
      - name: Build and test
        working-directory: backend
        run: mvn -B -ntp verify

  database:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: schoomano
          POSTGRES_USER: schoomano_owner
          POSTGRES_PASSWORD: ci-owner-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U schoomano_owner -d schoomano"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      PGPASSWORD: ci-owner-only
    steps:
      - uses: actions/checkout@v4
      - name: Migrate, seed and run RLS/invariant tests
        run: |
          P="psql -h localhost -U schoomano_owner -d schoomano -v ON_ERROR_STOP=1"
          $P -c "create role schoomano_app login password 'ci-app-only' nobypassrls"
          for f in backend/schoomano-app/src/main/resources/db/migration/V*.sql; do $P -f "$f"; done
          $P -f db/seed/dev_seed.sql
          $P -f db/tests/rls_and_invariants_test.sql
          $P -f db/tests/app_queries_smoke_test.sql

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Tokens, typecheck, lint, format, tests (incl. axe), build
        run: npm run check

  secrets-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
