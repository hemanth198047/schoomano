openapi: 3.1.0
info:
  title: Schoomano API
  version: 0.1.0
  description: |
    Stage A + B1 (academic structure) + B4 (sign-in) contract. Every endpoint authorizes on the server using the authenticated identity.
    The tenant is resolved from the identity, never accepted from the client; `X-Schoomano-Tenant`
    only selects among schools the identity already belongs to.

    Errors use RFC 9457 problem details with stable `code` and a `correlationId` for support.
    Denied reads of specific records return 404 (not 403) so callers cannot probe which records exist.
servers:
  - url: http://localhost:8080
security:
  - bearer: []

paths:
  /api/v1/me:
    get:
      summary: Current person, school, active roles and linked children
      operationId: getMe
      parameters:
        - $ref: '#/components/parameters/TenantSelector'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /api/v1/campuses:
    get:
      summary: Campuses the caller may read (CAMPUS_READ in scope)
      operationId: listCampuses
      parameters:
        - $ref: '#/components/parameters/TenantSelector'
      responses:
        '200':
          description: OK (may be empty, e.g. for guardians)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Campus' }
        '401': { $ref: '#/components/responses/Problem' }

  /api/v1/config/{key}:
    get:
      summary: Resolve the effective value of a setting for the group or one campus at a moment in time
      operationId: resolveConfig
      parameters:
        - $ref: '#/components/parameters/ConfigKey'
        - name: campusId
          in: query
          schema: { type: string, format: uuid }
        - name: programmeId
          in: query
          description: Resolve for one programme (e.g. `assessment.grade_scale`). Takes precedence over campusId.
          schema: { type: string, format: uuid }
        - name: asOf
          in: query
          description: Defaults to now. Past dates return the value that applied then.
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResolvedConfig' }
        '404': { $ref: '#/components/responses/Problem' }

  /api/v1/config/{key}/versions:
    get:
      summary: Full version history of a setting (all scopes, drafts included)
      operationId: listConfigVersions
      parameters:
        - $ref: '#/components/parameters/ConfigKey'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ConfigVersion' }
        '404': { $ref: '#/components/responses/Problem' }

  /api/v1/config/{key}/drafts:
    post:
      summary: Create a draft version (requires CONFIG_PUBLISH in the target scope). Audited.
      operationId: createConfigDraft
      parameters:
        - $ref: '#/components/parameters/ConfigKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DraftRequest' }
      responses:
        '201':
          description: Draft created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigVersion' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }

  /api/v1/config/drafts/{id}/preview:
    post:
      summary: Show, per campus (or for the one programme of a programme-scoped draft), the value before and after the draft takes effect
      operationId: previewConfigDraft
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PreviewRow' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /api/v1/config/drafts/{id}/publish:
    post:
      summary: Publish a draft. Closes the open version at the new effective date; never rewrites history. Audited, emits outbox event.
      operationId: publishConfigDraft
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Published
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigVersion' }
        '404': { $ref: '#/components/responses/Problem' }
        '409':
          description: Not a draft, or effective date not after the latest published version
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /api/v1/campuses/{campusId}/academic-structure:
    get:
      summary: Programmes with grades, sections, subjects and terms, plus the calendar, for one academic year (CAMPUS_READ)
      operationId: getAcademicStructure
      parameters:
        - $ref: '#/components/parameters/CampusId'
        - name: yearId
          in: query
          description: Defaults to the ACTIVE year, else the latest.
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AcademicStructure' }
        '404': { $ref: '#/components/responses/Problem' }

  /api/v1/programmes/{programmeId}/grades:
    post:
      summary: Add a grade to a programme (ACADEMIC_STRUCTURE_MANAGE). Audited.
      operationId: createGrade
      parameters:
        - $ref: '#/components/parameters/ProgrammeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name, ordinal]
              properties:
                code: { type: string, pattern: '^[A-Z0-9-]{1,12}$' }
                name: { type: string, maxLength: 80 }
                ordinal: { type: integer, minimum: -3, maximum: 20, description: Promotion order within the programme }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Grade' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /api/v1/programmes/{programmeId}/subjects:
    post:
      summary: Add a subject to a programme (ACADEMIC_STRUCTURE_MANAGE). Audited.
      operationId: createSubject
      parameters:
        - $ref: '#/components/parameters/ProgrammeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name]
              properties:
                code: { type: string, pattern: '^[A-Z0-9-]{2,16}$' }
                name: { type: string, maxLength: 80 }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Subject' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /api/v1/academic-years/{yearId}/terms:
    post:
      summary: Add a term for one programme. Must lie inside the year and not overlap the programme's other terms. Audited.
      operationId: createTerm
      parameters:
        - $ref: '#/components/parameters/YearId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [programmeId, label, startsOn, endsOn]
              properties:
                programmeId: { type: string, format: uuid }
                label: { type: string, maxLength: 40 }
                startsOn: { type: string, format: date }
                endsOn: { type: string, format: date }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Term' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409':
          description: "`term_rejected` (with `problems`: overlap, outside the year, duplicate label) or `wrong_campus`"
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /api/v1/academic-years/{yearId}/sections:
    post:
      summary: Add a section (e.g. Grade 5 C) for the year (ACADEMIC_STRUCTURE_MANAGE). Audited.
      operationId: createSection
      parameters:
        - $ref: '#/components/parameters/YearId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [gradeId, code]
              properties:
                gradeId: { type: string, format: uuid }
                code: { type: string, pattern: '^[A-Z0-9-]{1,8}$' }
                capacity: { type: integer, minimum: 1, maximum: 200 }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Section' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /api/v1/academic-years/{yearId}/calendar-events:
    post:
      summary: Add a holiday, exam window, event or working day (whole campus, or one programme). Audited.
      operationId: createCalendarEvent
      parameters:
        - $ref: '#/components/parameters/YearId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, title, startsOn, endsOn]
              properties:
                kind: { type: string, enum: [HOLIDAY, EXAM, EVENT, WORKING_DAY] }
                title: { type: string, maxLength: 120 }
                startsOn: { type: string, format: date }
                endsOn: { type: string, format: date }
                programmeId: { type: string, format: uuid, description: Omit for the whole campus }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CalendarEvent' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /api/v1/academic-years/{yearId}/rollover-preview:
    post:
      summary: Propose next year (dates, terms, sections, promotions, warnings). Computes only; writes no academic data.
      operationId: previewRollover
      parameters:
        - $ref: '#/components/parameters/YearId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RolloverPreview' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /api/v1/campuses/{campusId}/academic-years:
    post:
      summary: Create an academic year (PLANNED). Years of one campus never overlap. Audited.
      operationId: createAcademicYear
      parameters:
        - $ref: '#/components/parameters/CampusId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label, startsOn, endsOn]
              properties:
                label: { type: string, maxLength: 20 }
                startsOn: { type: string, format: date }
                endsOn: { type: string, format: date }
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AcademicYear' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /api/v1/academic-years/{yearId}/activate:
    post:
      summary: Make a PLANNED year active; the previously active year of the campus is closed. Audited.
      operationId: activateAcademicYear
      parameters:
        - $ref: '#/components/parameters/YearId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AcademicYear' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /api/v1/academic-years/{yearId}/close:
    post:
      summary: Close the active year. Audited.
      operationId: closeAcademicYear
      parameters:
        - $ref: '#/components/parameters/YearId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AcademicYear' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /api/v1/academic-years/{yearId}/rollover:
    post:
      summary: "Commit the rollover: next year (PLANNED) with terms and sections copied a year forward and students promoted one grade (same section letter when it exists). The source year is unchanged; a year rolls over once. Audited, emits outbox event."
      operationId: commitRollover
      parameters:
        - $ref: '#/components/parameters/YearId'
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RolloverResult' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /api/v1/terms/{termId}:
    patch:
      summary: Change a term's label or dates (same rules as creation). Audited.
      operationId: updateTerm
      parameters:
        - { name: termId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label, startsOn, endsOn]
              properties:
                label: { type: string, maxLength: 40 }
                startsOn: { type: string, format: date }
                endsOn: { type: string, format: date }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Term' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
    delete:
      summary: Remove a term. Audited.
      operationId: deleteTerm
      parameters:
        - { name: termId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Removed }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /api/v1/grades/{gradeId}:
    patch:
      summary: Rename a grade. Audited.
      operationId: renameGrade
      parameters:
        - { name: gradeId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 80 }
      responses:
        '200': { description: OK }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /api/v1/subjects/{subjectId}:
    patch:
      summary: Rename or retire a subject (subjects are never deleted). Audited.
      operationId: updateSubject
      parameters:
        - { name: subjectId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 80 }
                status: { type: string, enum: [ACTIVE, RETIRED] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Subject' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /api/v1/sections/{sectionId}:
    patch:
      summary: Change a section's capacity (not below its placed students). Audited.
      operationId: updateSection
      parameters:
        - { name: sectionId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                capacity: { type: [integer, 'null'], minimum: 1, maximum: 200 }
      responses:
        '200': { description: OK }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
    delete:
      summary: Remove a section with no student placements (`section_in_use` otherwise). Audited.
      operationId: deleteSection
      parameters:
        - { name: sectionId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Removed }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /api/v1/calendar-events/{eventId}:
    delete:
      summary: Remove a calendar entry. Audited.
      operationId: deleteCalendarEvent
      parameters:
        - { name: eventId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Removed }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /api/v1/academic-years/{yearId}/imports/students:
    post:
      summary: "Check (dry run) an export of students from the old system: .csv or .xlsx, up to 5 MB and 20,000 rows. Nothing changes until commit. Requires IMPORT_MANAGE. Audited."
      operationId: validateStudentImport
      parameters:
        - $ref: '#/components/parameters/YearId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '201':
          description: Checked; the plan per row (errors and conflicts first, at most 200 rows)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportBatch' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /api/v1/academic-years/{yearId}/imports:
    get:
      summary: Recent imports for the year (newest first, at most 50, without rows)
      operationId: listImports
      parameters:
        - $ref: '#/components/parameters/YearId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ImportBatch' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /api/v1/imports/{id}:
    get:
      summary: One import with a page of its rows
      operationId: getImport
      parameters:
        - $ref: '#/components/parameters/Id'
        - { name: action, in: query, schema: { type: string, enum: [CREATE, UPDATE, UNCHANGED, CONFLICT, ERROR] } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 0, maximum: 1000, default: 200 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportBatch' }
        '404': { $ref: '#/components/responses/Problem' }

  /api/v1/imports/{id}/commit:
    post:
      summary: "Apply exactly what the dry run showed. Refused with `stale_preview` if student records changed since the check. Rows with errors or conflicts are skipped. Audited, emits outbox event."
      operationId: commitImport
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Applied
          content:
            application/json:
              schema:
                type: object
                properties:
                  batch: { $ref: '#/components/schemas/ImportBatch' }
                  created: { type: integer }
                  updated: { type: integer }
                  unchanged: { type: integer }
                  skipped: { type: integer }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /api/v1/imports/{id}/discard:
    post:
      summary: Discard a checked import without applying it. Audited.
      operationId: discardImport
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Discarded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportBatch' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /api/v1/imports/{id}/rollback:
    post:
      summary: "Revert the latest committed import (`not_latest` otherwise). Values edited after the import are kept and listed. Audited."
      operationId: rollbackImport
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Rolled back
          content:
            application/json:
              schema:
                type: object
                properties:
                  batch: { $ref: '#/components/schemas/ImportBatch' }
                  removed: { type: integer }
                  restored: { type: integer }
                  linksRestored: { type: integer }
                  kept: { type: array, items: { type: string } }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /api/v1/academic-years/{yearId}/students:
    get:
      summary: "Students enrolled in the year (STUDENT_READ_BASIC on the campus). Search by name or admission number."
      operationId: listStudents
      parameters:
        - $ref: '#/components/parameters/YearId'
        - { name: q, in: query, schema: { type: string } }
        - { name: sectionId, in: query, schema: { type: string, format: uuid } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StudentPage' }
        '404': { $ref: '#/components/responses/Problem' }
    post:
      summary: "Create a student enrolled in the year (STUDENT_WRITE). Admission number generated when omitted. Audited."
      operationId: createStudent
      parameters:
        - $ref: '#/components/parameters/YearId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [givenName]
              properties:
                givenName: { type: string, maxLength: 80 }
                familyName: { type: string, maxLength: 80 }
                preferredName: { type: string, maxLength: 80 }
                dateOfBirth: { type: string, format: date }
                schoolRef: { type: string, pattern: '^[A-Za-z0-9/_-]{1,40}$' }
                sectionId: { type: string, format: uuid }
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StudentProfile' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /api/v1/students/{studentId}:
    get:
      summary: "Student profile. view=STAFF (role access) includes guardians and households; view=GUARDIAN (relationship access) shows only what the relationship allows and never other guardians."
      operationId: getStudent
      parameters:
        - { name: studentId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StudentProfile' }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
      summary: "Edit a student (STUDENT_WRITE). Fields owned by the old system during coexistence are refused with owned_by_old_system. Audited."
      operationId: updateStudent
      parameters:
        - { name: studentId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                givenName: { type: string }
                familyName: { type: string }
                preferredName: { type: string }
                dateOfBirth: { type: string, format: date }
                academicYearId: { type: string, format: uuid }
                sectionId: { type: string, format: uuid }
                clearSection: { type: boolean }
                reason: { type: string, maxLength: 500 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StudentProfile' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /api/v1/students/{studentId}/guardians:
    post:
      summary: "Link a guardian (STUDENT_WRITE + PERSON_MANAGE). An Indian mobile already on record links that person; one open relationship per guardian and child. Reason required. Audited."
      operationId: addGuardian
      parameters:
        - { name: studentId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [givenName, mobile, relationshipType, status, capabilities, reason]
              properties:
                givenName: { type: string, maxLength: 80 }
                familyName: { type: string, maxLength: 80 }
                mobile: { type: string, description: 10-digit Indian mobile in any common format }
                email: { type: string }
                relationshipType: { type: string, enum: [MOTHER, FATHER, GUARDIAN, GRANDPARENT, OTHER] }
                status: { type: string, enum: [ACTIVE, RESTRICTED] }
                capabilities: { type: array, items: { $ref: '#/components/schemas/GuardianCapability' } }
                pickupConfirmed: { type: boolean }
                reason: { type: string, minLength: 10, maxLength: 500 }
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StudentProfile' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /api/v1/guardian-relationships/{relationshipId}:
    patch:
      summary: "Change a relationship status and capabilities with a reason. Restricted guardians keep pickup only when confirmed; ended relationships cannot be reopened. Audited with before and after."
      operationId: updateGuardianRelationship
      parameters:
        - { name: relationshipId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status, capabilities, reason]
              properties:
                status: { type: string, enum: [ACTIVE, RESTRICTED, SUSPENDED, ENDED] }
                capabilities: { type: array, items: { $ref: '#/components/schemas/GuardianCapability' } }
                pickupConfirmed: { type: boolean }
                reason: { type: string, minLength: 10, maxLength: 500 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StudentProfile' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /api/v1/guardians/{guardianId}:
    patch:
      summary: "Change a guardian name, mobile or email with a reason (PERSON_MANAGE for one of their children). mobile_in_use if the number belongs to someone else. Audited."
      operationId: updateGuardian
      parameters:
        - { name: guardianId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                givenName: { type: string }
                familyName: { type: string }
                mobile: { type: string }
                email: { type: string }
                reason: { type: string, minLength: 10, maxLength: 500 }
      responses:
        '200':
          description: OK
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /api/v1/auth/otp/request:
    post:
      summary: "Parent sign-in step 1: text a 6-digit code to a mobile number. Public. Always 202 for an acceptable request, whether or not the number is on a guardian record (nothing reveals which); unknown numbers get no SMS but are limited and timed identically. 429 when asked again within 30 s (otp_resend_too_soon) or over the caps: 5/hour and 10/day per number, 20/hour per client address (otp_rate_limited)."
      operationId: requestOtp
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone: { type: string, description: "Indian mobile as typed; normalised to +91XXXXXXXXXX", examples: ["98450 12345"] }
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                required: [resendAfterSeconds]
                properties:
                  resendAfterSeconds: { type: integer, examples: [30] }
        '400': { $ref: '#/components/responses/Problem' }
        '429':
          description: otp_resend_too_soon or otp_rate_limited; `retryAfterSeconds` says how long to wait
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503': { $ref: '#/components/responses/Problem' }

  /api/v1/auth/otp/verify:
    post:
      summary: "Parent sign-in step 2: exchange the code for a session. Public. Codes work once for 5 minutes; 5 wrong guesses lock the code (otp_locked). A wrong, expired, used or never-issued code all answer 401 invalid_code. The session carries guardian rights only, never staff roles."
      operationId: verifyOtp
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, code]
              properties:
                phone: { type: string }
                code: { type: string, description: "6 digits; spaces tolerated" }
                deviceLabel: { type: string, maxLength: 200, description: "Shown to the school office in the guardian's session list" }
      responses:
        '200':
          description: Session started
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }

  /api/v1/auth/token/refresh:
    post:
      summary: "Exchange a refresh token for a new access and refresh token (rotation). Public. A refresh token that was already replaced means it leaked: the whole session is revoked and this answers 401 invalid_refresh_token."
      operationId: refreshToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '200':
          description: New tokens; the previous refresh token no longer works
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '401': { $ref: '#/components/responses/Problem' }

  /api/v1/auth/logout:
    post:
      summary: End the session of the access token presented
      operationId: logout
      responses:
        '204': { description: Session ended }
        '401': { $ref: '#/components/responses/Problem' }

  /api/v1/guardians/{guardianId}/sessions:
    get:
      summary: "Where a guardian is signed in (device label, first and last seen). PERSON_MANAGE for one of their children; otherwise 404."
      operationId: listGuardianSessions
      parameters:
        - { name: guardianId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Open sessions, most recently used first
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string, format: uuid }
                    deviceLabel: { type: [string, 'null'] }
                    signedInAt: { type: string, format: date-time }
                    lastSeenAt: { type: string, format: date-time }
        '404': { $ref: '#/components/responses/Problem' }

  /api/v1/guardians/{guardianId}/sessions/revoke:
    post:
      summary: "End every open session of a guardian's number, with a reason (min 10 characters, kept in the audit trail). Effective on the next request."
      operationId: revokeGuardianSessions
      parameters:
        - { name: guardianId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 10, maxLength: 500 }
      responses:
        '200':
          description: How many sessions were ended
          content:
            application/json:
              schema:
                type: object
                properties:
                  revoked: { type: integer }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /api/v1/campuses/{campusId}/periods:
    parameters:
      - { name: campusId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Timetable]
      summary: Bell schedule of a campus
      responses:
        '200': { description: Periods in order, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Period' } } } } }
        '404': { $ref: '#/components/responses/Problem' }
    put:
      tags: [Timetable]
      summary: Replace the bell schedule (TIMETABLE_MANAGE)
      description: Periods must follow the clock, may not overlap and need at least one lesson. Periods that lessons use cannot be removed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [periods]
              properties:
                periods: { type: array, minItems: 1, maxItems: 12, items: { $ref: '#/components/schemas/Period' } }
      responses:
        '200': { description: The new schedule, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Period' } } } } }
        '400': { description: invalid_schedule, with the list of problems, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /api/v1/campuses/{campusId}/rooms:
    parameters:
      - { name: campusId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Timetable]
      summary: Rooms of a campus
      responses:
        '200': { description: Rooms, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Room' } } } } }
    post:
      tags: [Timetable]
      summary: Add a room (TIMETABLE_MANAGE)
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Room' } } } }
        '409': { $ref: '#/components/responses/Problem' }
  /api/v1/rooms/{roomId}/retire:
    post:
      tags: [Timetable]
      summary: Retire a room that no lesson uses
      parameters:
        - { name: roomId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: The retired room, content: { application/json: { schema: { $ref: '#/components/schemas/Room' } } } }
        '409': { $ref: '#/components/responses/Problem' }
  /api/v1/campuses/{campusId}/teachers:
    get:
      tags: [Timetable]
      summary: Active teachers of the campus
      parameters:
        - { name: campusId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Teachers, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/TeacherOption' } } } } }
  /api/v1/academic-years/{yearId}/timetable:
    get:
      tags: [Timetable]
      summary: Lessons of the year, optionally for one section, teacher or room
      parameters:
        - { name: yearId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: sectionId, in: query, schema: { type: string, format: uuid } }
        - { name: teacherId, in: query, schema: { type: string, format: uuid } }
        - { name: roomId, in: query, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Lessons, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/TimetableEntry' } } } } }
        '404': { $ref: '#/components/responses/Problem' }
  /api/v1/academic-years/{yearId}/timetable/entries:
    post:
      tags: [Timetable]
      summary: Add a lesson (TIMETABLE_MANAGE)
      description: A draft may hold clashes. Once published, the database refuses a teacher or room being in two places and the answer says which (409 timetable_rejected).
      parameters:
        - { name: yearId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sectionId, day, periodId, subjectId, teacherId]
              properties:
                sectionId: { type: string, format: uuid }
                day: { type: integer, minimum: 1, maximum: 7, description: ISO weekday, 1 = Monday }
                periodId: { type: string, format: uuid }
                subjectId: { type: string, format: uuid }
                teacherId: { type: string, format: uuid }
                roomId: { type: string, format: uuid }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/TimetableEntry' } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /api/v1/timetable/entries/{entryId}:
    parameters:
      - { name: entryId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [Timetable]
      summary: Change the subject, teacher or room of a lesson
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/TimetableEntry' } } } }
        '409': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [Timetable]
      summary: Remove a lesson
      responses:
        '204': { description: Removed }
  /api/v1/academic-years/{yearId}/timetable/status:
    get:
      tags: [Timetable]
      summary: Draft or published, and the clashes in words
      parameters:
        - { name: yearId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Status, content: { application/json: { schema: { $ref: '#/components/schemas/TimetableStatus' } } } }
  /api/v1/academic-years/{yearId}/timetable/publish:
    post:
      tags: [Timetable]
      summary: Publish the timetable (TIMETABLE_MANAGE)
      parameters:
        - { name: yearId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Published, content: { application/json: { schema: { $ref: '#/components/schemas/TimetableStatus' } } } }
        '409': { description: publish_rejected, with the clashes as problems, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /api/v1/academic-years/{yearId}/timetable/unpublish:
    post:
      tags: [Timetable]
      summary: Return the timetable to draft (reason required, audited)
      parameters:
        - { name: yearId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [reason], properties: { reason: { type: string, minLength: 10, maxLength: 500 } } }
      responses:
        '200': { description: Draft, content: { application/json: { schema: { $ref: '#/components/schemas/TimetableStatus' } } } }
  /api/v1/academic-years/{yearId}/substitutions:
    parameters:
      - { name: yearId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Timetable]
      summary: Substitutions between two dates
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        '200': { description: Substitutions, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Substitution' } } } } }
    post:
      tags: [Timetable]
      summary: Arrange a substitute for one lesson on one date
      description: The timetable must be published and the date must fall on the lesson's weekday. The substitute must be a free teacher. Emits an outbox event (delivered by B7).
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Substitution' } } } }
        '409': { $ref: '#/components/responses/Problem' }
  /api/v1/academic-years/{yearId}/substitutions/available:
    get:
      tags: [Timetable]
      summary: Teachers free to cover a lesson on a date
      parameters:
        - { name: yearId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: entryId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: date, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200': { description: Teachers, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/TeacherOption' } } } } }
  /api/v1/substitutions/{id}:
    delete:
      tags: [Timetable]
      summary: Cancel a substitution
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Cancelled }
  /api/v1/timetable/me:
    get:
      tags: [Timetable]
      summary: The signed-in teacher's lessons for a date (default today, school time)
      description: Own lessons that are not covered by someone else, plus lessons they are covering. Published timetables only.
      parameters:
        - { name: date, in: query, schema: { type: string, format: date } }
      responses:
        '200': { description: Lessons in period order, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/MyLesson' } } } } }

  /api/v1/sections/{sectionId}/attendance:
    get:
      tags: [Attendance]
      summary: The register of a class for a day (default today, school time)
      parameters:
        - { name: sectionId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: date, in: query, schema: { type: string, format: date } }
      responses:
        '200': { description: Enrolled students with their mark and version, content: { application/json: { schema: { $ref: '#/components/schemas/AttendanceRoster' } } } }
        '404': { $ref: '#/components/responses/Problem' }
  /api/v1/sections/{sectionId}/attendance/batches:
    post:
      tags: [Attendance]
      summary: Record marks for a class and day (ATTENDANCE_MARK)
      description: |
        Needs an `Idempotency-Key` header (8 to 100 characters). Repeating a key with the same content returns the first
        answer with `replayed: true` and changes nothing; reusing it for different content is 409 `idempotency_key_reused`.
        Each mark carries the `baseVersion` the device last saw (0 if none). If the mark changed since, the device's
        value is not applied: the outcome is `CONFLICT`, the current value stays and the office resolves it.
        Marking a student ABSENT queues an outbox event so guardians can be told.
      parameters:
        - { name: sectionId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 8, maxLength: 100 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [date, source, marks]
              properties:
                date: { type: string, format: date }
                source: { type: string, enum: [DEVICE, WEB] }
                marks:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items:
                    type: object
                    required: [studentId, status]
                    properties:
                      studentId: { type: string, format: uuid }
                      status: { type: string, enum: [PRESENT, ABSENT, LATE, LEAVE] }
                      baseVersion: { type: integer, minimum: 0 }
                      markedAt: { type: string, format: date-time, description: Device time of the tap; never later than the server's now }
      responses:
        '200': { description: One outcome per mark, content: { application/json: { schema: { $ref: '#/components/schemas/AttendanceBatchResult' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { description: attendance_rejected (future day, outside the year, closed year), idempotency_key_reused or request_in_progress, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /api/v1/sections/{sectionId}/attendance/corrections:
    post:
      tags: [Attendance]
      summary: Office correction of one mark (ATTENDANCE_CORRECT)
      description: Always applies, needs a reason, is audited and appears in the mark's history.
      parameters:
        - { name: sectionId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [date, studentId, status, reason]
              properties:
                date: { type: string, format: date }
                studentId: { type: string, format: uuid }
                status: { type: string, enum: [PRESENT, ABSENT, LATE, LEAVE] }
                reason: { type: string, minLength: 3, maxLength: 200 }
      responses:
        '200': { description: Outcome, content: { application/json: { schema: { $ref: '#/components/schemas/AttendanceMarkResult' } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /api/v1/campuses/{campusId}/attendance/conflicts:
    get:
      tags: [Attendance]
      summary: Open conflicts of a campus (ATTENDANCE_CORRECT)
      parameters:
        - { name: campusId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Open conflicts, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/AttendanceConflict' } } } } }
        '403': { $ref: '#/components/responses/Problem' }
  /api/v1/attendance/conflicts/{conflictId}/resolve:
    post:
      tags: [Attendance]
      summary: Keep the current value or use the teacher's entry (ATTENDANCE_CORRECT)
      parameters:
        - { name: conflictId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [useAttempt, reason]
              properties:
                useAttempt: { type: boolean }
                reason: { type: string, minLength: 3, maxLength: 200 }
      responses:
        '200': { description: Resolved, content: { application/json: { schema: { type: object, properties: { id: { type: string, format: uuid }, resolution: { type: string, enum: [KEPT_CURRENT, USED_ATTEMPT] } } } } } }
        '409': { $ref: '#/components/responses/Problem' }

  /api/v1/campuses/{campusId}/notices:
    parameters:
      - { name: campusId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Notices]
      summary: Write an announcement to one class, or to the whole campus (NOTICE_SEND)
      description: |
        Teachers must name a class; only office roles (group admin, campus admin, principal) may write to a whole campus.
        The database decides who is reached: guardians with an ACTIVE or RESTRICTED relationship that allows notices
        (a restricted guardian is notices-only). Suspended or ended relationships receive nothing. Everyone reached gets
        an in-app notice; SMS follows, never between 21:00 and 07:00 India time, and carries only the title.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, body]
              properties:
                title: { type: string, minLength: 3, maxLength: 120 }
                body: { type: string, maxLength: 2000 }
                sectionId: { type: string, format: uuid, nullable: true }
      responses:
        '201': { description: Sent, content: { application/json: { schema: { type: object, properties: { id: { type: string, format: uuid }, people: { type: integer } } } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    get:
      tags: [Notices]
      summary: Recently sent announcements with delivery counts (NOTICE_SEND)
      responses:
        '200': { description: Sent notices, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/SentNotice' } } } } }
  /api/v1/notices/mine:
    get:
      tags: [Notices]
      summary: The signed-in person's own notices, newest first
      responses:
        '200': { description: Inbox, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/InboxItem' } } } } }
  /api/v1/notices/{deliveryId}/read:
    post:
      tags: [Notices]
      summary: Mark one of your own notices as read
      parameters:
        - { name: deliveryId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Marked }
        '404': { description: Not your notice, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }

  /api/v1/campuses/{campusId}/fee-heads:
    parameters: [{ $ref: '#/components/parameters/CampusId' }]
    get:
      tags: [Fees]
      summary: Fee heads of a campus (FEE_READ)
      responses:
        '200': { description: Fee heads, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/FeeHead' } } } } }
        '404': { $ref: '#/components/responses/Problem' }
    post:
      tags: [Fees]
      summary: Add a fee head (FEE_MANAGE)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name]
              properties:
                code: { type: string, pattern: '^[A-Z0-9-]{2,16}$' }
                name: { type: string, minLength: 2, maxLength: 80 }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/FeeHead' } } } }
        '409': { $ref: '#/components/responses/Problem' }
  /api/v1/academic-years/{yearId}/invoices:
    parameters: [{ $ref: '#/components/parameters/YearId' }]
    get:
      tags: [Fees]
      summary: Invoices of a year, newest first, at most 500 (FEE_READ)
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [ISSUED, PARTIALLY_PAID, PAID, CANCELLED] } }
        - { name: studentId, in: query, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Invoices, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/InvoiceSummary' } } } } }
    post:
      tags: [Fees]
      summary: Issue one invoice (FEE_MANAGE). The total is the sum of its lines, in paise.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [studentId, dueOn, lines]
              properties:
                studentId: { type: string, format: uuid }
                dueOn: { type: string, format: date }
                lines: { type: array, minItems: 1, maxItems: 20, items: { $ref: '#/components/schemas/InvoiceLineRequest' } }
      responses:
        '201': { description: Issued, content: { application/json: { schema: { $ref: '#/components/schemas/InvoiceDetail' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /api/v1/academic-years/{yearId}/invoices/bulk:
    parameters: [{ $ref: '#/components/parameters/YearId' }]
    post:
      tags: [Fees]
      summary: One invoice per enrolled student of a class (FEE_MANAGE). Repeating a batchKey skips students who already have it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sectionId, dueOn, batchKey, lines]
              properties:
                sectionId: { type: string, format: uuid }
                dueOn: { type: string, format: date }
                batchKey: { type: string, minLength: 8, maxLength: 60 }
                lines: { type: array, minItems: 1, maxItems: 20, items: { $ref: '#/components/schemas/InvoiceLineRequest' } }
      responses:
        '201': { description: Counts, content: { application/json: { schema: { type: object, properties: { created: { type: integer }, skipped: { type: integer } } } } } }
        '400': { $ref: '#/components/responses/Problem' }
  /api/v1/students/{studentId}/invoices:
    get:
      tags: [Fees]
      summary: A child's invoices, for staff with FEE_READ or a guardian with the pay-fees capability
      parameters:
        - { name: studentId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Invoices, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/InvoiceSummary' } } } } }
        '404': { $ref: '#/components/responses/Problem' }
  /api/v1/students/{studentId}/attendance:
    get:
      tags: [Attendance]
      summary: One child's attendance over at most 92 days, for a guardian with the view-attendance capability or staff with ATTENDANCE_READ in scope
      parameters:
        - { name: studentId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200':
          description: Days with a recorded mark, and counts
          content:
            application/json:
              schema:
                type: object
                properties:
                  studentId: { type: string, format: uuid }
                  from: { type: string, format: date }
                  to: { type: string, format: date }
                  present: { type: integer }
                  absent: { type: integer }
                  late: { type: integer }
                  leave: { type: integer }
                  days:
                    type: array
                    items:
                      type: object
                      properties:
                        date: { type: string, format: date }
                        status: { type: string, enum: [PRESENT, ABSENT, LATE, LEAVE] }
                        classLabel: { type: string }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /api/v1/invoices/{invoiceId}:
    get:
      tags: [Fees]
      summary: One invoice with its lines and payments
      parameters:
        - { name: invoiceId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Invoice, content: { application/json: { schema: { $ref: '#/components/schemas/InvoiceDetail' } } } }
        '404': { $ref: '#/components/responses/Problem' }
  /api/v1/invoices/{invoiceId}/cancel:
    post:
      tags: [Fees]
      summary: Cancel an invoice that has no successful payment, with a reason (FEE_MANAGE)
      parameters:
        - { name: invoiceId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [reason], properties: { reason: { type: string, minLength: 3, maxLength: 200 } } }
      responses:
        '200': { description: Cancelled, content: { application/json: { schema: { $ref: '#/components/schemas/InvoiceDetail' } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /api/v1/invoices/{invoiceId}/payments/offline:
    post:
      tags: [Fees]
      summary: Record cash, cheque or office UPI (FEE_MANAGE). Repeating the Idempotency-Key returns the first result.
      parameters:
        - { name: invoiceId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 8, maxLength: 100 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amountPaise, method]
              properties:
                amountPaise: { type: integer, format: int64, minimum: 1 }
                method: { type: string, enum: [CASH, CHEQUE, UPI_OFFICE] }
                reference: { type: string, maxLength: 60, description: Required for cheques }
      responses:
        '201': { description: Recorded, content: { application/json: { schema: { $ref: '#/components/schemas/InvoiceDetail' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '409': { description: More than is due, a cancelled invoice, or a reused key, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /api/v1/invoices/{invoiceId}/pay:
    post:
      tags: [Fees]
      summary: A guardian with the pay-fees capability starts an online payment. It stays pending until the provider's signed webhook arrives.
      parameters:
        - { name: invoiceId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 8, maxLength: 100 } }
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { amountPaise: { type: integer, format: int64, nullable: true, description: Defaults to everything still due } } }
      responses:
        '201': { description: Order created, content: { application/json: { schema: { $ref: '#/components/schemas/PaymentOrder' } } } }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '503': { description: No payment provider configured, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /api/v1/payments/webhook:
    post:
      tags: [Fees]
      summary: The payment provider's event. The X-Signature HMAC over the raw body is the only credential; each event id is applied once.
      security: []
      parameters:
        - { name: X-Signature, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [eventId, orderId, amountPaise, status]
              properties:
                eventId: { type: string }
                orderId: { type: string }
                paymentId: { type: string }
                amountPaise: { type: integer, format: int64 }
                status: { type: string, enum: [SUCCEEDED, FAILED] }
      responses:
        '200':
          description: Processed. outcome is one of APPLIED, DUPLICATE, IGNORED, UNKNOWN_ORDER, AMOUNT_MISMATCH, FAILED_RECORDED, OVERPAYMENT.
          content: { application/json: { schema: { type: object, properties: { outcome: { type: string } } } } }
        '401': { description: Bad or missing signature, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /api/v1/payments/sandbox/complete:
    post:
      tags: [Fees]
      summary: Sandbox only. Completes the caller's own pending payment through the same path as a real webhook. 404 when a real provider is configured.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderId, outcome]
              properties:
                orderId: { type: string }
                outcome: { type: string, enum: [SUCCEEDED, FAILED] }
      responses:
        '200': { description: Applied, content: { application/json: { schema: { type: object, properties: { outcome: { type: string } } } } } }
        '404': { $ref: '#/components/responses/Problem' }
  /api/v1/campuses/{campusId}/fees/reconciliation:
    parameters: [{ $ref: '#/components/parameters/CampusId' }]
    get:
      tags: [Fees]
      summary: Collections per day and method, and what needs a person (refunds due, amount mismatches, stale pending payments) (FEE_READ)
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200': { description: Report, content: { application/json: { schema: { $ref: '#/components/schemas/Reconciliation' } } } }
        '404': { $ref: '#/components/responses/Problem' }

  /api/v1/support/grants:
    get:
      tags: [Support]
      summary: Platform support access this school has approved, newest first (SUPPORT_GRANT_MANAGE, school administrators only)
      responses:
        '200': { description: Grants, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/SupportGrant' } } } } }
        '404': { $ref: '#/components/responses/Problem' }
    post:
      tags: [Support]
      summary: Approve a named support person for a stated purpose, 1 to 8 hours from now (SUPPORT_GRANT_MANAGE)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [supportUserRef, purpose, hours]
              properties:
                supportUserRef: { type: string, minLength: 3, maxLength: 200, description: "Sign-in identity as issuer:subject" }
                purpose: { type: string, minLength: 10, maxLength: 500 }
                hours: { type: integer, minimum: 1, maximum: 8 }
      responses:
        '201': { description: Approved, content: { application/json: { schema: { $ref: '#/components/schemas/SupportGrant' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /api/v1/support/grants/{id}/revoke:
    post:
      tags: [Support]
      summary: End support access now (SUPPORT_GRANT_MANAGE). Takes effect on the next request.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { reason: { type: string, maxLength: 200 } } }
      responses:
        '200': { description: Ended, content: { application/json: { schema: { $ref: '#/components/schemas/SupportGrant' } } } }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { description: Already ended, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /api/v1/audit:
    get:
      tags: [Support]
      summary: The school's audit trail, newest first (AUDIT_READ; also open to platform support during an approved grant)
      parameters:
        - { name: actorKind, in: query, schema: { type: string, enum: [USER, SUPPORT, SYSTEM, BREAK_GLASS, INTEGRATION] } }
        - { name: action, in: query, description: Prefix match, schema: { type: string } }
        - { name: beforeSeq, in: query, schema: { type: integer, format: int64 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200': { description: Entries, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/AuditRow' } } } } }
        '404': { $ref: '#/components/responses/Problem' }
  /api/v1/audit/verify:
    get:
      tags: [Support]
      summary: Walk the whole trail and report the first gap, broken link or altered entry (AUDIT_READ). Entries written before V12 are checked for order and links only.
      responses:
        '200': { description: Result, content: { application/json: { schema: { type: object, properties: { checked: { type: integer }, intact: { type: boolean }, brokenSeq: { type: integer, nullable: true }, problem: { type: string, nullable: true } } } } } }
        '404': { $ref: '#/components/responses/Problem' }
  /api/v1/operations/health:
    get:
      tags: [Support]
      summary: "Operational checks for the school (AUDIT_READ): delivery backlog, failed texts, payments needing a person, attendance conflicts, audit volume, open support access"
      responses:
        '200': { description: Checks, content: { application/json: { schema: { type: object, properties: { at: { type: string, format: date-time }, supportAccessLive: { type: integer }, checks: { type: array, items: { type: object, properties: { key: { type: string }, label: { type: string }, level: { type: string, enum: [OK, ATTENTION] }, detail: { type: string } } } } } } } } }
        '404': { $ref: '#/components/responses/Problem' }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: OIDC access token for staff, or an opaque `smo_...` session token for parents who signed in with a phone code (see /api/v1/auth). Local development only accepts `dev:<subject>` for synthetic seed users.

  parameters:
    TenantSelector:
      name: X-Schoomano-Tenant
      in: header
      required: false
      description: Tenant slug, only when the identity belongs to more than one school group. Never trusted alone.
      schema: { type: string, pattern: '^[a-z0-9-]{3,40}$' }
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      schema: { type: string, pattern: '^[A-Za-z0-9-]{8,64}$' }
    ConfigKey:
      name: key
      in: path
      required: true
      schema: { type: string, pattern: '^[a-z][a-z0-9_.]{2,80}$' }
    CampusId:
      name: campusId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ProgrammeId:
      name: programmeId
      in: path
      required: true
      schema: { type: string, format: uuid }
    YearId:
      name: yearId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    Problem:
      description: Problem details
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    SentNotice:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        audience: { type: string, description: Class label or "Whole campus" }
        createdAt: { type: string, format: date-time }
        people: { type: integer }
        smsSent: { type: integer }
        smsWaiting: { type: integer }
        smsFailed: { type: integer }
        smsSkipped: { type: integer, description: People with no mobile number }
    InboxItem:
      type: object
      properties:
        id: { type: string, format: uuid, description: The delivery id, used to mark it read }
        kind: { type: string, enum: [ANNOUNCEMENT, ATTENDANCE, SUBSTITUTION] }
        title: { type: string }
        body: { type: string }
        receivedAt: { type: string, format: date-time }
        read: { type: boolean }
    AttendanceRoster:
      type: object
      properties:
        sectionId: { type: string, format: uuid }
        sectionLabel: { type: string }
        date: { type: string, format: date }
        openConflicts: { type: integer }
        students:
          type: array
          items:
            type: object
            properties:
              studentId: { type: string, format: uuid }
              schoolRef: { type: string }
              name: { type: string }
              status: { type: string, enum: [PRESENT, ABSENT, LATE, LEAVE], nullable: true }
              version: { type: integer, nullable: true }
    AttendanceMarkResult:
      type: object
      properties:
        studentId: { type: string, format: uuid }
        outcome: { type: string, enum: [CREATED, UPDATED, UNCHANGED, CONFLICT, REJECTED] }
        status: { type: string, nullable: true }
        version: { type: integer, nullable: true }
        message: { type: string, nullable: true }
    AttendanceBatchResult:
      type: object
      properties:
        results: { type: array, items: { $ref: '#/components/schemas/AttendanceMarkResult' } }
        conflicts: { type: integer }
        replayed: { type: boolean }
    AttendanceConflict:
      type: object
      properties:
        id: { type: string, format: uuid }
        studentId: { type: string, format: uuid }
        studentName: { type: string }
        sectionLabel: { type: string }
        date: { type: string, format: date }
        currentStatus: { type: string }
        currentVersion: { type: integer }
        attemptedStatus: { type: string }
        attemptedBy: { type: string }
        attemptedMarkedAt: { type: string, format: date-time }
    Period:
      type: object
      required: [ordinal, label, startsAt, endsAt, kind]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        ordinal: { type: integer, minimum: 1, maximum: 12 }
        label: { type: string, maxLength: 40 }
        startsAt: { type: string, example: "08:30" }
        endsAt: { type: string, example: "09:15" }
        kind: { type: string, enum: [LESSON, BREAK] }
    Room:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        capacity: { type: integer, nullable: true }
        status: { type: string, enum: [ACTIVE, RETIRED] }
    TeacherOption:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
    TimetableEntry:
      type: object
      properties:
        id: { type: string, format: uuid }
        sectionId: { type: string, format: uuid }
        sectionLabel: { type: string }
        day: { type: integer }
        periodId: { type: string, format: uuid }
        periodOrdinal: { type: integer }
        periodLabel: { type: string }
        subjectId: { type: string, format: uuid }
        subjectName: { type: string }
        teacherId: { type: string, format: uuid }
        teacherName: { type: string }
        roomId: { type: string, format: uuid, nullable: true }
        roomName: { type: string, nullable: true }
    TimetableStatus:
      type: object
      properties:
        status: { type: string, enum: [DRAFT, PUBLISHED] }
        version: { type: integer }
        publishedAt: { type: string, format: date-time, nullable: true }
        clashes:
          type: array
          items:
            type: object
            properties:
              kind: { type: string, enum: [TEACHER, ROOM] }
              day: { type: integer }
              period: { type: string }
              resource: { type: string }
              sections: { type: array, items: { type: string } }
              text: { type: string }
    Substitution:
      type: object
      properties:
        id: { type: string, format: uuid }
        entryId: { type: string, format: uuid }
        onDate: { type: string, format: date }
        sectionLabel: { type: string }
        periodOrdinal: { type: integer }
        periodLabel: { type: string }
        subjectName: { type: string }
        absentTeacherId: { type: string, format: uuid }
        absentTeacherName: { type: string }
        substituteId: { type: string, format: uuid }
        substituteName: { type: string }
        reason: { type: string }
    MyLesson:
      type: object
      properties:
        date: { type: string, format: date }
        periodOrdinal: { type: integer }
        periodLabel: { type: string }
        startsAt: { type: string }
        endsAt: { type: string }
        sectionLabel: { type: string }
        subjectName: { type: string }
        roomName: { type: string, nullable: true }
        coverFor: { type: string, nullable: true, description: Name of the teacher being covered, when this is a substitution }
    TokenResponse:
      type: object
      required: [tokenType, accessToken, expiresIn, refreshToken, refreshExpiresIn]
      properties:
        tokenType: { type: string, enum: [Bearer] }
        accessToken: { type: string, description: "Opaque; stored hashed on the server. Lives 30 minutes." }
        expiresIn: { type: integer, description: seconds }
        refreshToken: { type: string, description: "Opaque, single use (rotates on every refresh). Lives 30 days." }
        refreshExpiresIn: { type: integer, description: seconds }
    Problem:
      type: object
      required: [status, code, correlationId]
      properties:
        status: { type: integer }
        title: { type: string }
        detail: { type: string }
        code:
          type: string
          examples: [unauthenticated, forbidden, not_found, no_membership, tenant_selection_required, validation_failed, conflict, publish_rejected, invalid_value, term_rejected, wrong_campus, outside_year, stale_preview, not_latest, not_validated, unreadable_file, file_too_large, owned_by_old_system, invalid_mobile, mobile_in_use, already_linked, relationship_rejected, invalid_code, invalid_code_format, otp_locked, otp_resend_too_soon, otp_rate_limited, invalid_refresh_token, sign_in_not_configured, sms_unavailable, reason_required, mfa_required, invalid_schedule, period_in_use, room_in_use, timetable_rejected, wrong_day, idempotency_key_required, idempotency_key_reused, invalid_range, grant_not_open, invalid_status, invalid_source, duplicate_student, attendance_rejected, request_in_progress]
        correlationId: { type: string }
        problems:
          type: array
          description: User-readable reasons, e.g. which term a new term overlaps
          items: { type: string }
        fields:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }

    GuardianCapability:
      type: string
      enum: [VIEW_ATTENDANCE, VIEW_ACADEMIC, PAY_FEES, GIVE_CONSENT, RECEIVE_NOTICES, PICKUP]

    Me:
      type: object
      required: [personId, displayName, tenant, roles, children, policyVersion]
      properties:
        personId: { type: string, format: uuid }
        displayName: { type: string }
        tenant:
          type: object
          required: [id, slug, name]
          properties:
            id: { type: string, format: uuid }
            slug: { type: string }
            name: { type: string }
        roles:
          type: array
          items:
            type: object
            properties:
              roleKey: { type: string }
              scopeLevel: { type: string, enum: [GROUP, LEGAL_ENTITY, CAMPUS, PROGRAMME, ACADEMIC_YEAR, CLASS] }
              scopeId: { type: string, format: uuid }
              scopeName: { type: string }
        children:
          type: array
          items:
            type: object
            properties:
              studentId: { type: string, format: uuid }
              displayName: { type: string }
              schoolRef: { type: string }
              campusId: { type: string, format: uuid }
              campusName: { type: string }
              capabilities:
                type: array
                items: { $ref: '#/components/schemas/GuardianCapability' }
        policyVersion: { type: string }

    Campus:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        timeZone: { type: string, examples: [Asia/Kolkata] }
        status: { type: string, enum: [SETUP, ACTIVE, ARCHIVED] }
        legalEntity: { type: string }
        activeYear: { type: string }

    ResolvedConfig:
      type: object
      properties:
        key: { type: string }
        value: {}
        version: { type: integer }
        definedAtLevel: { type: string }
        definedAtId: { type: string, format: uuid }
        inherited: { type: boolean }
        asOf: { type: string, format: date-time }

    ConfigVersion:
      type: object
      properties:
        id: { type: string, format: uuid }
        scopeLevel: { type: string, enum: [GROUP, CAMPUS, PROGRAMME] }
        scopeId: { type: string, format: uuid }
        version: { type: integer }
        value: {}
        effectiveFrom: { type: string, format: date-time }
        effectiveTo: { type: string, format: date-time }
        status: { type: string, enum: [DRAFT, PUBLISHED, RETIRED] }
        changeNote: { type: string }
        publishedAt: { type: string, format: date-time }

    DraftRequest:
      type: object
      required: [scopeLevel, scopeId, value, effectiveFrom, changeNote]
      properties:
        scopeLevel: { type: string, enum: [GROUP, CAMPUS, PROGRAMME] }
        scopeId: { type: string, format: uuid }
        value:
          description: Any JSON value. Known keys are checked (e.g. `assessment.grade_scale` must be a GradeScale; flags are booleans).
          anyOf:
            - $ref: '#/components/schemas/GradeScale'
            - {}
        effectiveFrom: { type: string, format: date-time }
        changeNote: { type: string, maxLength: 500 }

    PreviewRow:
      type: object
      properties:
        campusId: { type: string, format: uuid }
        campusName: { type: string }
        before: {}
        after: {}
        changed: { type: boolean }
        programmeId: { type: [string, 'null'], format: uuid }
        programmeName: { type: [string, 'null'] }

    GradeScale:
      description: "Value of config key `assessment.grade_scale` (PROGRAMME scope only). Each band is the lowest whole percentage earning that grade; one band starts at 0."
      type: object
      required: [bands]
      properties:
        bands:
          type: array
          minItems: 2
          items:
            type: object
            required: [grade, minPercent]
            properties:
              grade: { type: string, pattern: '^[A-Za-z0-9+-]{1,6}$' }
              minPercent: { type: integer, minimum: 0, maximum: 100 }

    AcademicYear:
      type: object
      properties:
        id: { type: string, format: uuid }
        label: { type: string, examples: ['2026-27'] }
        startsOn: { type: string, format: date }
        endsOn: { type: string, format: date }
        status: { type: string, enum: [PLANNED, ACTIVE, CLOSED] }

    Section:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        capacity: { type: [integer, 'null'] }
        students: { type: integer, description: Enrolled students placed in this section }

    Grade:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        ordinal: { type: integer }
        sections:
          type: array
          items: { $ref: '#/components/schemas/Section' }

    Subject:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        status: { type: string, enum: [ACTIVE, RETIRED] }

    Term:
      type: object
      properties:
        id: { type: string, format: uuid }
        label: { type: string }
        startsOn: { type: string, format: date }
        endsOn: { type: string, format: date }

    CalendarEvent:
      type: object
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [HOLIDAY, EXAM, EVENT, WORKING_DAY] }
        title: { type: string }
        startsOn: { type: string, format: date }
        endsOn: { type: string, format: date }
        programmeId: { type: [string, 'null'], format: uuid }

    AcademicStructure:
      type: object
      properties:
        campusId: { type: string, format: uuid }
        campusName: { type: string }
        years:
          type: array
          items: { $ref: '#/components/schemas/AcademicYear' }
        year:
          oneOf:
            - $ref: '#/components/schemas/AcademicYear'
            - type: 'null'
        programmes:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              code: { type: string }
              name: { type: string }
              board: { type: string, enum: [CBSE, CISCE, IB, CAMBRIDGE, STATE, OTHER] }
              boardDetail: { type: [string, 'null'] }
              grades:
                type: array
                items: { $ref: '#/components/schemas/Grade' }
              subjects:
                type: array
                items: { $ref: '#/components/schemas/Subject' }
              terms:
                type: array
                items: { $ref: '#/components/schemas/Term' }
        calendar:
          type: array
          items: { $ref: '#/components/schemas/CalendarEvent' }

    RolloverResult:
      type: object
      properties:
        yearId: { type: string, format: uuid }
        label: { type: string }
        startsOn: { type: string, format: date }
        endsOn: { type: string, format: date }
        termsCreated: { type: integer }
        sectionsCreated: { type: integer }
        studentsPlaced: { type: integer }
        studentsUnplaced: { type: integer, description: "Carried forward without a section: no section in the next grade, or none before" }
        studentsCompleted: { type: integer, description: "Final-grade students, not carried into the new year" }

    ImportBatch:
      type: object
      properties:
        id: { type: string, format: uuid }
        entity: { type: string, enum: [STUDENT] }
        fileName: { type: string }
        status: { type: string, enum: [VALIDATED, COMMITTED, ROLLED_BACK, DISCARDED] }
        academicYearId: { type: string, format: uuid }
        yearLabel: { type: string }
        counts:
          type: object
          description: Rows per result, plus MISSING (previously imported students absent from this file; never deleted)
          additionalProperties: { type: integer }
        fileProblems: { type: array, items: { type: string } }
        missingFromFile: { type: array, items: { type: string }, description: First 100 references }
        createdAt: { type: string, format: date-time }
        committedAt: { type: string, format: date-time }
        rolledBackAt: { type: string, format: date-time }
        rowsTotal: { type: integer }
        rows:
          type: array
          items:
            type: object
            properties:
              rowNo: { type: integer, description: Spreadsheet row number (header is row 1) }
              externalRef: { type: string, description: Admission number in the old system }
              action: { type: string, enum: [CREATE, UPDATE, UNCHANGED, CONFLICT, ERROR] }
              problems: { type: array, items: { type: string } }
              changes:
                type: array
                items:
                  type: object
                  properties:
                    field: { type: string, enum: [givenName, familyName, dateOfBirth, placement] }
                    before: { type: string }
                    after: { type: string }

    StudentPage:
      type: object
      properties:
        total: { type: integer }
        students:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              schoolRef: { type: string }
              displayName: { type: string }
              programmeCode: { type: string }
              gradeName: { type: string }
              sectionCode: { type: string }
              sectionId: { type: string, format: uuid }
              guardians: { type: integer }
              source: { type: string, enum: [LEGACY, SCHOOMANO] }
              status: { type: string }

    StudentProfile:
      type: object
      properties:
        id: { type: string, format: uuid }
        schoolRef: { type: string }
        givenName: { type: string }
        familyName: { type: string }
        preferredName: { type: string }
        dateOfBirth: { type: string, format: date, description: Omitted for guardians without academic access }
        status: { type: string }
        view: { type: string, enum: [STAFF, GUARDIAN] }
        source: { type: string }
        ownedFields: { type: array, items: { type: string }, description: Old-system fields that are read-only during coexistence }
        placements:
          type: array
          items:
            type: object
            properties:
              academicYearId: { type: string, format: uuid }
              yearLabel: { type: string }
              campusName: { type: string }
              programmeCode: { type: string }
              gradeName: { type: string }
              sectionCode: { type: string }
              sectionId: { type: string, format: uuid }
              status: { type: string }
        guardians:
          type: array
          description: Staff view only
          items:
            type: object
            properties:
              relationshipId: { type: string, format: uuid }
              guardianId: { type: string, format: uuid }
              displayName: { type: string }
              givenName: { type: string }
              familyName: { type: string }
              mobile: { type: string, examples: ['+91 98450 12345'] }
              email: { type: string }
              relationshipType: { type: string }
              status: { type: string, enum: [ACTIVE, RESTRICTED, SUSPENDED, ENDED] }
              capabilities: { type: array, items: { $ref: '#/components/schemas/GuardianCapability' } }
              sharesHousehold: { type: boolean }
        households: { type: array, items: { type: string } }
        yourCapabilities: { type: array, items: { $ref: '#/components/schemas/GuardianCapability' }, description: Guardian view only }

    DateRange:
      type: object
      properties:
        startsOn: { type: string, format: date }
        endsOn: { type: string, format: date }

    RolloverPreview:
      type: object
      properties:
        label: { type: string, examples: ['2027-28'] }
        dates: { $ref: '#/components/schemas/DateRange' }
        terms:
          type: array
          items:
            type: object
            properties:
              programmeCode: { type: string }
              label: { type: string }
              dates: { $ref: '#/components/schemas/DateRange' }
        sections:
          type: array
          items:
            type: object
            properties:
              programmeCode: { type: string }
              gradeCode: { type: string }
              sectionCode: { type: string }
              capacity: { type: [integer, 'null'] }
        promotions:
          type: array
          items:
            type: object
            properties:
              programmeCode: { type: string }
              fromGrade: { type: string }
              toGrade: { type: [string, 'null'], description: null when the students complete the programme }
              students: { type: integer }
        warnings:
          type: array
          items: { type: string }

    FeeHead:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        status: { type: string }
    InvoiceLineRequest:
      type: object
      required: [description, amountPaise]
      properties:
        feeHeadId: { type: string, format: uuid, nullable: true }
        description: { type: string, minLength: 2, maxLength: 120 }
        amountPaise: { type: integer, format: int64, minimum: 1 }
    InvoiceSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        number: { type: string, example: INV-2026-27-000001 }
        status: { type: string, enum: [ISSUED, PARTIALLY_PAID, PAID, CANCELLED] }
        studentId: { type: string, format: uuid }
        studentName: { type: string }
        dueOn: { type: string, format: date }
        totalPaise: { type: integer, format: int64 }
        paidPaise: { type: integer, format: int64 }
        overdue: { type: boolean }
    InvoiceDetail:
      type: object
      properties:
        invoice: { $ref: '#/components/schemas/InvoiceSummary' }
        lines: { type: array, items: { type: object, properties: { description: { type: string }, amountPaise: { type: integer, format: int64 } } } }
        payments:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              amountPaise: { type: integer, format: int64 }
              method: { type: string, enum: [GATEWAY, CASH, CHEQUE, UPI_OFFICE] }
              status: { type: string, enum: [PENDING, SUCCEEDED, FAILED, NEEDS_REFUND] }
              reference: { type: string, nullable: true }
              createdAt: { type: string, format: date-time }
              completedAt: { type: string, format: date-time, nullable: true }
    PaymentOrder:
      type: object
      properties:
        paymentId: { type: string, format: uuid }
        orderId: { type: string }
        amountPaise: { type: integer, format: int64 }
        provider: { type: string }
        sandbox: { type: boolean }
    Reconciliation:
      type: object
      properties:
        collectedPaise: { type: integer, format: int64 }
        days:
          type: array
          items:
            type: object
            properties:
              date: { type: string, format: date }
              method: { type: string }
              payments: { type: integer }
              totalPaise: { type: integer, format: int64 }
        exceptions:
          type: array
          items:
            type: object
            properties:
              kind: { type: string, enum: [REFUND_DUE, AMOUNT_MISMATCH, STALE_PENDING] }
              invoiceNumber: { type: string }
              amountPaise: { type: integer, format: int64 }
              at: { type: string, format: date-time }
              detail: { type: string }

    SupportGrant:
      type: object
      properties:
        id: { type: string, format: uuid }
        supportUserRef: { type: string }
        purpose: { type: string }
        approvedBy: { type: string }
        startsAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        revokedAt: { type: string, format: date-time, nullable: true }
        state: { type: string, enum: [ACTIVE, UPCOMING, EXPIRED, REVOKED] }
    AuditRow:
      type: object
      properties:
        seq: { type: integer, format: int64 }
        occurredAt: { type: string, format: date-time }
        actorKind: { type: string }
        actorName: { type: string }
        action: { type: string }
        resourceType: { type: string }
        resourceId: { type: string, nullable: true }
        outcome: { type: string, enum: [ALLOW, DENY, ERROR, SUCCESS] }
        reason: { type: string, nullable: true }
        correlationId: { type: string, nullable: true }
        details: { type: object }
